services:
  corvus:
    image: ghcr.io/brhnshn/corvus:latest
    container_name: corvus
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - CORVUS_PORT=8090
      - CORVUS_DATA_DIR=/data
      - DOCKER_SOCKET=/var/run/docker.sock
      - CORVUS_AUTH_ENABLED=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # Docker socket mount:
      # Use '/var/run/docker.sock:/var/run/docker.sock:ro' for read-only monitoring.
      # Mount as read-write to enable container lifecycle controls (Start, Stop, Pause, Restart).
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistent SQLite database volume
      - corvus-data:/data

volumes:
  corvus-data:
