name: CI & Continuous Deployment

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  packages: write

jobs:
  backend-test:
    name: Backend .NET 9 Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore tests/Corvus.Api.Tests/Corvus.Api.Tests.csproj

      - name: Build and Test
        run: dotnet test tests/Corvus.Api.Tests/Corvus.Api.Tests.csproj --configuration Release --verbosity normal --logger "console;verbosity=detailed"

  frontend-build:
    name: Frontend React Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: src/Corvus.Web/package-lock.json

      - name: Install Dependencies
        working-directory: src/Corvus.Web
        run: npm ci

      - name: Build Frontend
        working-directory: src/Corvus.Web
        run: npm run build

  release-and-deploy:
    name: Release, Docker Build & Deploy
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.repository_owner == 'brhnshn' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Build Metadata
        id: build_meta
        run: |
          VERSION=$(python3 -c "
          import re
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              text = f.read()
          m = re.search(r'##\s*\[(\d+\.\d+\.\d+)\]', text)
          print(m.group(1) if m else '1.5.30')
          ")
          SHORT_SHA=$(git rev-parse --short HEAD)

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "docker_tags=ghcr.io/brhnshn/corvus:latest,ghcr.io/brhnshn/corvus:sha-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.build_meta.outputs.docker_tags }}
          build-args: |
            APP_VERSION=${{ steps.build_meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Server Deploy
        run: |
          SUCCESS=0
          for i in 1 2 3; do
            echo "Attempt $i: Triggering server deploy webhook..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.DEPLOY_URL }}" \
              -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '${{ secrets.DEPLOY_PAYLOAD }}' \
              --connect-timeout 15 \
              --max-time 60 || echo "000")

            echo "Deploy webhook attempt $i response status: $HTTP_STATUS"
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
              echo "Deploy webhook successfully triggered!"
              SUCCESS=1
              break
            else
              echo "Attempt $i failed with HTTP status $HTTP_STATUS."
              if [ $i -lt 3 ]; then
                echo "Waiting 10 seconds before retry..."
                sleep 10
              fi
            fi
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "::error::Deploy webhook failed after 3 attempts."
            exit 1
          fi
