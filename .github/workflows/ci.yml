name: CI & Continuous Deployment

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  backend-test:
    name: Backend .NET 9 Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore tests/Corvus.Api.Tests/Corvus.Api.Tests.csproj

      - name: Build and Test
        run: dotnet test tests/Corvus.Api.Tests/Corvus.Api.Tests.csproj --configuration Release --verbosity normal

  frontend-build:
    name: Frontend React Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: src/Corvus.Web/package-lock.json

      - name: Install Dependencies
        working-directory: src/Corvus.Web
        run: npm ci

      - name: Build Frontend
        working-directory: src/Corvus.Web
        run: npm run build

  deploy-latest:
    name: Build Latest Docker & Deploy
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.repository_owner == 'brhnshn' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: version_info
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.5.17")
          CLEAN_VERSION="${LATEST_TAG#v}"
          echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image (latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/brhnshn/corvus:latest
            ghcr.io/brhnshn/corvus:sha-${{ steps.version_info.outputs.short_sha }}
          build-args: |
            APP_VERSION=${{ steps.version_info.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Server Deploy
        run: |
          SUCCESS=0
          for i in 1 2 3; do
            echo "Attempt $i: Triggering server deploy webhook..."
            HTTP_STATUS=$(curl -s -w "%{http_code}" -o /tmp/deploy_response.txt -X POST "${{ secrets.DEPLOY_URL }}" \
              -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '${{ secrets.DEPLOY_PAYLOAD }}' \
              --connect-timeout 15 \
              --max-time 60 || echo "000")

            echo "Deploy webhook attempt $i response status: $HTTP_STATUS"
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
              echo "Deploy webhook successfully triggered!"
              cat /tmp/deploy_response.txt || true
              echo ""
              SUCCESS=1
              break
            else
              echo "Attempt $i failed (Status: $HTTP_STATUS). Server response:"
              cat /tmp/deploy_response.txt || true
              echo ""
              if [ $i -lt 3 ]; then
                echo "Waiting 10 seconds before retry..."
                sleep 10
              fi
            fi
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "::error::Deploy webhook failed after 3 attempts."
            exit 1
          fi
