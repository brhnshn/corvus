name: CI & Continuous Deployment

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  packages: write

jobs:
  backend-test:
    name: Backend .NET 9 Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore tests/Corvus.Api.Tests/Corvus.Api.Tests.csproj

      - name: Allow ICMP Sockets for Tests
        run: |
          sudo sysctl -w net.ipv4.ping_group_range="0 2147483647" || true
          sudo setcap cap_net_raw+ep $(which dotnet) || true

      - name: Build and Test
        run: |
          dotnet test tests/Corvus.Api.Tests/Corvus.Api.Tests.csproj --configuration Release --logger "trx;LogFileName=test_results.trx" || TEST_FAILED=1
          if [ -f "tests/Corvus.Api.Tests/TestResults/test_results.trx" ]; then
            echo "### ❌ Test Failure Summary" >> $GITHUB_STEP_SUMMARY
            grep -E "UnitTestResult.*outcome=\"Failed\"" tests/Corvus.Api.Tests/TestResults/test_results.trx >> $GITHUB_STEP_SUMMARY || true
            grep -A 10 -E "<ErrorMessage>" tests/Corvus.Api.Tests/TestResults/test_results.trx >> $GITHUB_STEP_SUMMARY || true
            echo "=== FAILED TESTS FROM TRX ==="
            cat tests/Corvus.Api.Tests/TestResults/test_results.trx | grep -E "(testName|ErrorMessage|StackTrace)" | head -n 30 || true
          fi
          if [ "$TEST_FAILED" = "1" ]; then
            exit 1
          fi

  frontend-build:
    name: Frontend React Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: src/Corvus.Web/package-lock.json

      - name: Install Dependencies
        working-directory: src/Corvus.Web
        run: npm ci

      - name: Build Frontend
        working-directory: src/Corvus.Web
        run: npm run build

  release-and-deploy:
    name: Release, Docker Build & Deploy
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.repository_owner == 'brhnshn' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Build Metadata
        id: build_meta
        run: |
          VERSION=$(python3 -c "
          import re
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              text = f.read()
          m = re.search(r'##\s*\[(\d+\.\d+\.\d+)\]', text)
          print(m.group(1) if m else '1.6.3')
          ")
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG_NAME="v${VERSION}"

          if git rev-parse "$TAG_NAME" >/dev/null 2>&1 || git ls-remote --tags origin "refs/tags/$TAG_NAME" | grep -q "$TAG_NAME"; then
            echo "is_new_tag=false" >> $GITHUB_OUTPUT
            echo "docker_tags=ghcr.io/brhnshn/corvus:latest,ghcr.io/brhnshn/corvus:sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "agent_docker_tags=ghcr.io/brhnshn/corvus-agent:latest,ghcr.io/brhnshn/corvus-agent:sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
          else
            echo "is_new_tag=true" >> $GITHUB_OUTPUT
            echo "docker_tags=ghcr.io/brhnshn/corvus:latest,ghcr.io/brhnshn/corvus:${VERSION},ghcr.io/brhnshn/corvus:sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "agent_docker_tags=ghcr.io/brhnshn/corvus-agent:latest,ghcr.io/brhnshn/corvus-agent:${VERSION},ghcr.io/brhnshn/corvus-agent:sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Create and Push Git Tag
        if: steps.build_meta.outputs.is_new_tag == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.build_meta.outputs.tag }}" -m "Release ${{ steps.build_meta.outputs.tag }}"
          git push origin "${{ steps.build_meta.outputs.tag }}"

      - name: Extract Release Notes from CHANGELOG.md
        if: steps.build_meta.outputs.is_new_tag == 'true'
        run: |
          python3 -c "
          import re

          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              text = f.read()

          pattern = r'##\s*\[(.*?)\][^\n]*\n(.*?)(?=\n---\s*\n|\n##\s*\[|\Z)'
          match = re.search(pattern, text, re.DOTALL)
          notes = match.group(2).strip() if match else ''

          if not notes:
              notes = 'Routine bug fixes and maintenance improvements.'

          notes += '\n\n---\n**Full Changelog**: https://github.com/brhnshn/corvus/blob/main/CHANGELOG.md'

          with open('RELEASE_BODY.md', 'w', encoding='utf-8') as out:
              out.write(notes)
          "

      - name: Create GitHub Release
        if: steps.build_meta.outputs.is_new_tag == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.build_meta.outputs.tag }}
          name: Corvus ${{ steps.build_meta.outputs.tag }}
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image (Corvus Hub)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.build_meta.outputs.docker_tags }}
          build-args: |
            APP_VERSION=${{ steps.build_meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Docker Image (Corvus Agent)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.agent
          push: true
          tags: ${{ steps.build_meta.outputs.agent_docker_tags }}
          build-args: |
            APP_VERSION=${{ steps.build_meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Server Deploy
        run: |
          SUCCESS=0
          for i in 1 2 3; do
            echo "Attempt $i: Triggering server deploy webhook..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.DEPLOY_URL }}" \
              -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '${{ secrets.DEPLOY_PAYLOAD }}' \
              --connect-timeout 15 \
              --max-time 60 || echo "000")

            echo "Deploy webhook attempt $i response status: $HTTP_STATUS"
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
              echo "Deploy webhook successfully triggered!"
              SUCCESS=1
              break
            else
              echo "Attempt $i failed with HTTP status $HTTP_STATUS."
              if [ $i -lt 3 ]; then
                echo "Waiting 10 seconds before retry..."
                sleep 10
              fi
            fi
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "::error::Deploy webhook failed after 3 attempts."
            exit 1
          fi
