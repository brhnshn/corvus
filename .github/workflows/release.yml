name: Release / Production Version

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.6.0 or v1.6.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  test-and-verify:
    name: Verify Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run Backend Tests
        run: dotnet test tests/Corvus.Api.Tests/Corvus.Api.Tests.csproj --configuration Release --verbosity normal

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: src/Corvus.Web/package-lock.json

      - name: Build Frontend
        working-directory: src/Corvus.Web
        run: |
          npm ci
          npm run build

  publish-release:
    name: Create GitHub Release & Versioned Docker
    runs-on: ubuntu-latest
    needs: [test-and-verify]
    if: github.repository_owner == 'brhnshn'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Version and Tag
        id: resolve_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_INPUT="${{ github.event.inputs.version }}"
            CLEAN_VERSION="${RAW_INPUT#v}"
            TAG_NAME="v${CLEAN_VERSION}"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME" || true
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            CLEAN_VERSION="${TAG_NAME#v}"
          fi
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT

      - name: Extract Release Notes from CHANGELOG.md
        run: |
          python3 -c "
          import re

          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              text = f.read()

          pattern = r'##\s*\[(.*?)\][^\n]*\n(.*?)(?=\n---\s*\n|\n##\s*\[|\Z)'
          match = re.search(pattern, text, re.DOTALL)
          notes = match.group(2).strip() if match else ''

          if not notes:
              notes = 'Routine bug fixes and maintenance improvements.'

          notes += '\n\n---\n**Full Changelog**: https://github.com/brhnshn/corvus/blob/main/CHANGELOG.md'

          with open('RELEASE_BODY.md', 'w', encoding='utf-8') as out:
              out.write(notes)
          "

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.resolve_version.outputs.tag }}
          name: Corvus ${{ steps.resolve_version.outputs.tag }}
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Versioned Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/brhnshn/corvus:${{ steps.resolve_version.outputs.version }}
            ghcr.io/brhnshn/corvus:latest
          build-args: |
            APP_VERSION=${{ steps.resolve_version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Server Deploy
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.DEPLOY_URL }}" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '${{ secrets.DEPLOY_PAYLOAD }}')
          echo "Deploy webhook triggered for release ${{ steps.resolve_version.outputs.tag }} (HTTP status: $HTTP_STATUS)"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 400 ]; then
            echo "::error::Deploy webhook returned status $HTTP_STATUS"
            exit 1
          fi
