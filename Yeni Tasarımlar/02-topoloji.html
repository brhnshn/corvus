<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corvus — 02 Topoloji</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#07090d;--grid:#11161f;--line:#1e2633;--text:#d7dde8;--dim:#6b7689;--accent:#7cf0c8;--warn:#ffb547;--err:#ff5d6c;--ok:#7cf0c8;--sans:'Space Grotesk',sans-serif;--mono:'JetBrains Mono',monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--text);font-family:var(--sans)}
  #stage{position:fixed;inset:0;cursor:grab;
    background-image:radial-gradient(circle,var(--grid) 1px,transparent 1.2px);background-size:24px 24px}
  #stage:active{cursor:grabbing}
  svg#map{width:100%;height:100%}

  /* edges */
  .edge{stroke:var(--line);stroke-width:1.2;fill:none}
  .edge.flow{stroke:var(--accent);stroke-width:1.2;stroke-dasharray:2 10;opacity:.55;animation:flow 1.2s linear infinite}
  .edge.flow.warn{stroke:var(--warn)}
  .edge.dead{stroke:var(--err);stroke-dasharray:4 4;opacity:.6}
  @keyframes flow{to{stroke-dashoffset:-12}}

  /* nodes */
  .node{cursor:pointer}
  .node .ring{fill:var(--bg);stroke:var(--line);stroke-width:1.2;transition:stroke .2s}
  .node:hover .ring,.node.sel .ring{stroke:var(--text)}
  .node .core{transition:r .2s}
  .node text{font-family:var(--mono);font-size:11px;fill:var(--text);pointer-events:none}
  .node text.sub{fill:var(--dim);font-size:9.5px}
  .node.err .pulse{fill:none;stroke:var(--err);animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
  .node.warn .pulse{fill:none;stroke:var(--warn);animation:pulse 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.6);opacity:0}}
  .host .ring{stroke:var(--dim);stroke-dasharray:3 3}
  .group-label{font-family:var(--mono);font-size:10px;fill:var(--dim);letter-spacing:.14em;text-transform:uppercase}

  /* HUD */
  .hud{position:fixed;pointer-events:none;font-family:var(--mono)}
  .hud *{pointer-events:auto}
  .tl{top:22px;left:26px}
  .brand{font-family:var(--sans);font-weight:600;font-size:18px;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
  .brand .dot{width:8px;height:8px;background:var(--accent);border-radius:50%;box-shadow:0 0 12px var(--accent)}
  .crumb{font-size:11px;color:var(--dim);margin-top:6px}
  .tr{top:22px;right:26px;display:flex;gap:28px;text-align:right}
  .m .v{font-size:22px;font-weight:500;color:var(--text);font-family:var(--sans)}
  .m .v small{font-size:12px;color:var(--dim)}
  .m .k{font-size:10px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase}
  .bl{bottom:22px;left:26px;display:flex;flex-direction:column;gap:6px;max-width:420px}
  .issue{display:flex;align-items:center;gap:10px;font-size:12px;padding:6px 0;cursor:pointer;color:var(--text);opacity:.85}
  .issue:hover{opacity:1}
  .issue b{width:6px;height:6px;border-radius:50%}
  .issue span.d{color:var(--dim)}
  .issue-h{font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:2px}
  .br{bottom:22px;right:26px;font-size:11px;color:var(--dim);display:flex;gap:16px;align-items:center}
  .br kbd{border-bottom:1px solid var(--dim);padding:0 2px;color:var(--text)}
  .legend{display:flex;gap:14px}
  .legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}

  /* Inspector */
  #insp{position:fixed;top:0;right:0;height:100%;width:380px;background:linear-gradient(90deg,transparent,var(--bg) 12%);padding:90px 28px 28px 60px;transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);font-family:var(--mono)}
  #insp.open{transform:none}
  #insp .t{font-family:var(--sans);font-size:30px;font-weight:500;line-height:1.1}
  #insp .s{font-size:11px;color:var(--dim);margin:6px 0 22px}
  #insp .state{font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:18px}
  #insp dl{display:grid;grid-template-columns:auto 1fr;gap:9px 18px;font-size:12px;margin-bottom:24px}
  #insp dt{color:var(--dim)}
  #insp .spark{width:100%;height:56px;margin-bottom:24px}
  #insp .acts{display:flex;flex-direction:column;gap:2px}
  #insp .acts button{all:unset;cursor:pointer;font-size:12px;padding:9px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--text)}
  #insp .acts button:hover{color:var(--accent)}
  #insp .acts button span{color:var(--dim)}
  #insp .x{position:absolute;top:28px;right:28px;cursor:pointer;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<div id="stage"><svg id="map"><g id="world"></g></svg></div>

<div class="hud tl">
  <div class="brand"><span class="dot"></span>corvus</div>
  <div class="crumb">homelab-01 / topoloji · sürükle · kaydır · düğüme tıkla</div>
</div>
<div class="hud tr">
  <div class="m"><div class="v">23<small>%</small></div><div class="k">cpu</div></div>
  <div class="m"><div class="v">6.1<small>/16G</small></div><div class="k">ram</div></div>
  <div class="m"><div class="v">41<small>%</small></div><div class="k">disk</div></div>
  <div class="m"><div class="v">7<small>/8</small></div><div class="k">ayakta</div></div>
</div>
<div class="hud bl" id="issues"></div>
<div class="hud br">
  <div class="legend"><span><i style="background:var(--ok)"></i>sağlıklı</span><span><i style="background:var(--warn)"></i>yavaş</span><span><i style="background:var(--err)"></i>kapalı</span></div>
  <span><kbd>F</kbd> sorunlara odaklan</span><span><kbd>0</kbd> sıfırla</span>
</div>

<aside id="insp"><span class="x" onclick="closeInsp()">esc ✕</span><div id="inspBody"></div></aside>

<script>
const N=[
  {id:'net',n:'internet',x:0,y:-300,kind:'host'},
  {id:'proxy',n:'traefik',sub:'reverse proxy',x:0,y:-170,s:'ok',ms:3},
  {id:'host',n:'homelab-01',sub:'docker host',x:0,y:0,kind:'host'},
  {id:'nextcloud',n:'nextcloud',sub:'cloud.sahin.dev',x:-300,y:-60,s:'ok',ms:142},
  {id:'immich',n:'immich',sub:'photos.sahin.dev',x:-330,y:90,s:'ok',ms:210},
  {id:'immich-ml',n:'immich-ml',sub:'cpu %31',x:-470,y:190,s:'ok'},
  {id:'postgres',n:'postgres',sub:'db · 890MB',x:-170,y:210,s:'ok'},
  {id:'gitea',n:'gitea',sub:'git.sahin.dev',x:260,y:-90,s:'warn',ms:1840,why:'yanıt süresi 1.8s · 14 dk'},
  {id:'vault',n:'vaultwarden',sub:'vault.sahin.dev',x:330,y:60,s:'warn',ms:88,why:'SSL 9 gün içinde bitiyor'},
  {id:'jellyfin',n:'jellyfin',sub:'media.sahin.lan',x:180,y:220,s:'err',why:'exit 137 · OOM · 03:12'},
  {id:'ha',n:'home-assistant',sub:'ha.sahin.lan',x:-60,y:330,s:'ok',ms:34},
  {id:'paperless',n:'paperless',sub:'docs.sahin.lan',x:110,y:380,s:'ok',ms:96},
  {id:'pihole',n:'pihole',sub:'dns.sahin.lan',x:-250,y:-210,s:'ok',ms:12},
];
const E=[['net','proxy'],['proxy','host'],['net','pihole'],['host','nextcloud'],['host','immich'],['immich','immich-ml'],['immich','postgres'],['nextcloud','postgres'],['host','gitea'],['gitea','postgres'],['host','vault'],['host','jellyfin'],['host','ha'],['host','paperless'],['paperless','postgres']];
const col={ok:'var(--ok)',warn:'var(--warn)',err:'var(--err)'};
const byId=Object.fromEntries(N.map(n=>[n.id,n]));
const world=document.getElementById('world');
let html='';
E.forEach(([a,b])=>{const A=byId[a],B=byId[b];const st=B.s==='err'?'dead':B.s==='warn'?'flow warn':'flow';
  const mx=(A.x+B.x)/2,my=(A.y+B.y)/2-20;
  html+=`<path class="edge" d="M${A.x},${A.y} Q${mx},${my} ${B.x},${B.y}"/><path class="edge ${st}" d="M${A.x},${A.y} Q${mx},${my} ${B.x},${B.y}"/>`});
N.forEach(n=>{
  const r=n.kind==='host'?22:14;
  html+=`<g class="node ${n.kind||''} ${n.s||''}" data-id="${n.id}" transform="translate(${n.x},${n.y})">
    ${n.s&&n.s!=='ok'?`<circle class="pulse" r="${r}"/>`:''}
    <circle class="ring" r="${r}"/>
    ${n.s?`<circle class="core" r="4" fill="${col[n.s]}"/>`:`<circle r="3" fill="var(--dim)"/>`}
    <text x="${r+10}" y="-2">${n.n}</text>${n.sub?`<text class="sub" x="${r+10}" y="12">${n.sub}</text>`:''}
  </g>`});
world.innerHTML=html;

// pan/zoom
let tx=innerWidth/2,ty=innerHeight/2+10,k=1;
const apply=(anim)=>{world.style.transition=anim?'transform .6s cubic-bezier(.2,.8,.2,1)':'none';world.setAttribute('transform',`translate(${tx},${ty}) scale(${k})`);world.style.transform=`translate(${tx}px,${ty}px) scale(${k})`};
apply();
let drag=null;
const stage=document.getElementById('stage');
stage.addEventListener('mousedown',e=>{if(e.target.closest('.node'))return;drag={x:e.clientX-tx,y:e.clientY-ty}});
addEventListener('mousemove',e=>{if(!drag)return;tx=e.clientX-drag.x;ty=e.clientY-drag.y;apply()});
addEventListener('mouseup',()=>drag=null);
stage.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.1:.9;const nk=Math.min(2.5,Math.max(.4,k*f));tx=e.clientX-(e.clientX-tx)*(nk/k);ty=e.clientY-(e.clientY-ty)*(nk/k);k=nk;apply()},{passive:false});
function focus(n,zoom=1.6){k=zoom;tx=innerWidth/2-160-n.x*k;ty=innerHeight/2-n.y*k;apply(true)}

// inspector
function spark(bad){let p=[];for(let i=0;i<60;i++){let v=20+Math.sin(i/4)*6+Math.random()*5;if(bad&&i>48)v=bad==='err'?0:46+Math.random()*6;p.push(`${i*5.5},${56-v}`)}return p.join(' ')}
function openInsp(id){
  const n=byId[id];if(!n.s)return;
  document.querySelectorAll('.node').forEach(g=>g.classList.toggle('sel',g.dataset.id===id));
  const lbl={ok:'● çalışıyor',warn:'● dikkat',err:'● kapalı'}[n.s];
  const acts=n.s==='err'?[['yeniden başlat','R'],['son logları göster','L'],['bellek limitini artır','M']]:n.s==='warn'?[['logları aç','L'],[n.id==='vault'?'sertifikayı yenile':'yeniden başlat','R'],['susturmak için 1 saat','S']]:[['logları aç','L'],['terminal','T'],['yeniden başlat','R']];
  document.getElementById('inspBody').innerHTML=`
    <div class="state" style="color:${col[n.s]}">${lbl}</div>
    <div class="t">${n.n}</div><div class="s">${n.sub}</div>
    <svg class="spark" viewBox="0 0 330 56" preserveAspectRatio="none"><polyline points="${spark(n.s!=='ok'&&n.s)}" fill="none" stroke="${col[n.s]}" stroke-width="1.3"/></svg>
    <dl><dt>durum</dt><dd>${n.why||'son 30 günde %99.98 erişilebilir'}</dd><dt>yanıt</dt><dd>${n.ms?n.ms+' ms':'—'}</dd><dt>imaj</dt><dd>${n.id}:latest</dd><dt>bağlı</dt><dd>${E.filter(e=>e.includes(id)).map(e=>e[0]===id?e[1]:e[0]).join(', ')}</dd></dl>
    <div class="acts">${acts.map(a=>`<button>${a[0]}<span>${a[1]}</span></button>`).join('')}</div>`;
  document.getElementById('insp').classList.add('open');focus(n);
}
function closeInsp(){document.getElementById('insp').classList.remove('open');document.querySelectorAll('.node').forEach(g=>g.classList.remove('sel'))}
world.addEventListener('click',e=>{const g=e.target.closest('.node');if(g)openInsp(g.dataset.id)});

// issues
const iss=N.filter(n=>n.s&&n.s!=='ok').sort((a,b)=>a.s==='err'?-1:1);
document.getElementById('issues').innerHTML=`<div class="issue-h">${iss.length} sinyal</div>`+iss.map(n=>`<div class="issue" data-id="${n.id}"><b style="background:${col[n.s]}"></b>${n.n} <span class="d">— ${n.why}</span></div>`).join('');
document.querySelectorAll('.issue').forEach(el=>el.onclick=()=>openInsp(el.dataset.id));
let fi=0;
addEventListener('keydown',e=>{
  if(e.key==='Escape')closeInsp();
  if(e.key==='0'){closeInsp();k=1;tx=innerWidth/2;ty=innerHeight/2+10;apply(true)}
  if(e.key.toLowerCase()==='f'){openInsp(iss[fi%iss.length].id);fi++}
});
</script>
</body>
</html>
