<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corvus — 04 Sessiz</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0b0c;--text:#ededed;--mid:#8a8a8f;--faint:#3a3a3e;--hair:#1c1c1f;--ok:#4ade80;--warn:#fbbf24;--err:#f87171;--sans:'Geist',system-ui,sans-serif;--mono:'Geist Mono',monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:300;min-height:100vh;overflow-x:hidden}
  main{max-width:880px;margin:0 auto;padding:12vh 32px 120px}

  .orb{width:10px;height:10px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 0 var(--warn);animation:breathe 3.2s ease-in-out infinite;margin-bottom:36px}
  @keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(251,191,36,.35)}50%{box-shadow:0 0 0 14px rgba(251,191,36,0)}}
  h1{font-weight:300;font-size:clamp(34px,5vw,54px);line-height:1.12;letter-spacing:-.03em;color:var(--mid)}
  h1 b{font-weight:400;color:var(--text)}

  /* issues as sentences */
  .items{margin-top:56px}
  .it{display:grid;grid-template-columns:14px 1fr auto;gap:16px;align-items:baseline;padding:18px 0;border-top:1px solid var(--hair);transition:opacity .4s, transform .4s}
  .it:last-child{border-bottom:1px solid var(--hair)}
  .it i{width:6px;height:6px;border-radius:50%;transform:translateY(-3px)}
  .it .t{font-size:18px;font-weight:400}
  .it .d{font-size:14px;color:var(--mid);margin-top:4px}
  .it .a{font-family:var(--mono);font-size:12px;color:var(--mid);display:flex;gap:18px;opacity:0;transition:opacity .2s}
  .it:hover .a{opacity:1}
  .it .a span{cursor:pointer}.it .a span:hover{color:var(--text)}
  .it .a kbd{font-family:var(--mono);color:var(--faint);margin-left:4px}
  .it.gone{opacity:0;transform:translateX(20px)}

  /* river */
  .river{margin-top:96px}
  .rh{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--faint);margin-bottom:14px}
  .lane{display:grid;grid-template-columns:120px 1fr 64px;gap:16px;align-items:center;height:26px;font-size:13px;color:var(--mid)}
  .lane:hover{color:var(--text)}
  .lane .bar{position:relative;height:1px;background:var(--hair)}
  .lane .seg{position:absolute;top:-3px;height:7px;border-radius:2px}
  .lane .ms{font-family:var(--mono);font-size:11px;text-align:right}
  .now{position:absolute;right:0;top:-8px;bottom:-8px;width:1px;background:var(--faint)}

  /* vitals inline */
  .vitals{margin-top:96px;font-size:15px;color:var(--mid);line-height:2}
  .vitals b{font-weight:400;color:var(--text);font-family:var(--mono);font-size:14px}

  /* command bar */
  .hint{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:12px;color:var(--faint);transition:opacity .3s}
  .hint kbd{color:var(--mid);border:1px solid var(--faint);border-radius:4px;padding:1px 6px;margin:0 3px}
  #cmd{position:fixed;inset:0;background:rgba(11,11,12,.86);display:none;align-items:flex-start;justify-content:center;padding-top:22vh}
  #cmd.open{display:flex}
  .box{width:min(560px,92vw)}
  .box input{width:100%;background:none;border:none;border-bottom:1px solid var(--faint);color:var(--text);font:300 26px var(--sans);padding:10px 0;outline:none;letter-spacing:-.02em}
  .box ul{list-style:none;margin-top:14px}
  .box li{display:flex;justify-content:space-between;padding:10px 0;font-size:15px;color:var(--mid);cursor:pointer}
  .box li.on{color:var(--text)}
  .box li span{font-family:var(--mono);font-size:11px;color:var(--faint)}
  .toast{position:fixed;bottom:64px;left:50%;transform:translateX(-50%) translateY(10px);font-family:var(--mono);font-size:12px;color:var(--ok);opacity:0;transition:.3s}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .corner{position:fixed;top:24px;left:32px;font-family:var(--mono);font-size:12px;color:var(--faint)}
  .corner-r{position:fixed;top:24px;right:32px;font-family:var(--mono);font-size:12px;color:var(--faint)}
</style>
</head>
<body>
<div class="corner">corvus</div>
<div class="corner-r" id="clock"></div>
<main>
  <div class="orb" id="orb"></div>
  <h1 id="h">Sistemin büyük kısmı sessiz.<br><b id="hb">Üç şey seni bekliyor.</b></h1>

  <div class="items" id="items"></div>

  <section class="river">
    <div class="rh"><span>son 24 saat</span><span>şimdi</span></div>
    <div id="lanes"></div>
  </section>

  <p class="vitals">
    homelab-01 <b>41 gündür</b> açık. İşlemci <b>%23</b>, bellek <b>6,1 / 16 GB</b>, disk <b>412 / 1000 GB</b>.
    En çok tüketen <b>immich-ml</b>, gece taraması sürüyor. Son yedek <b>14:30</b>'da alındı, <b>38,2 GB</b>.
  </p>
</main>
<div class="hint" id="hint">her şeye <kbd>/</kbd> ile ulaş · sorun üzerinde <kbd>R</kbd> <kbd>L</kbd></div>
<div class="toast" id="toast"></div>

<div id="cmd"><div class="box"><input id="q" placeholder="ne yapmak istiyorsun?" autocomplete="off"><ul id="res"></ul></div></div>

<script>
let issues=[
  {id:'j',c:'err',t:'jellyfin durdu',d:'Gece 03:12\'de bellek yetersizliğinden kapandı (exit 137).',a:[['yeniden başlat','R'],['loglar','L']]},
  {id:'g',c:'warn',t:'gitea yavaşladı',d:'14 dakikadır ortalama 1,8 sn yanıt veriyor; normalde 120 ms.',a:[['loglar','L'],['yeniden başlat','R']]},
  {id:'v',c:'warn',t:'vaultwarden sertifikası bitiyor',d:'9 gün kaldı. Otomatik yenileme başarısız olmuş.',a:[['şimdi yenile','R'],['ertele','E']]},
];
const col={ok:'var(--ok)',warn:'var(--warn)',err:'var(--err)'};
const words=['','Bir şey','İki şey','Üç şey'];
function render(){
  document.getElementById('items').innerHTML=issues.map(x=>`<div class="it" data-id="${x.id}"><i style="background:${col[x.c]}"></i><div><div class="t">${x.t}</div><div class="d">${x.d}</div></div><div class="a">${x.a.map(a=>`<span data-act="${a[0]}">${a[0]}<kbd>${a[1]}</kbd></span>`).join('')}</div></div>`).join('');
  document.querySelectorAll('.it .a span').forEach(s=>s.onclick=()=>resolve(s.closest('.it').dataset.id,s.dataset.act));
  const hb=document.getElementById('hb'),orb=document.getElementById('orb');
  if(issues.length){hb.textContent=`${words[issues.length]} seni bekliyor.`}
  else{document.getElementById('h').innerHTML='Her şey sessiz.<br><b>Yapacak bir şey yok.</b>';orb.style.background='var(--ok)';orb.style.animation='none'}
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function resolve(id,act){const el=document.querySelector(`.it[data-id="${id}"]`);const x=issues.find(i=>i.id===id);
  if(act==='loglar'){toast(`${x.t.split(' ')[0]} logları açılıyor…`);return}
  el.classList.add('gone');toast(`✓ ${x.t.split(' ')[0]} · ${act}`);setTimeout(()=>{issues=issues.filter(i=>i.id!==id);render()},400)}
let hovered=null;
document.addEventListener('mouseover',e=>{const it=e.target.closest('.it');hovered=it?it.dataset.id:null});
render();

// lanes
const L=[['nextcloud',142,[]],['jellyfin',null,[[13.2,100,'err']]],['gitea',1840,[[97,100,'warn']]],['vaultwarden',88,[]],['immich',210,[[38,41,'warn']]],['home-assistant',34,[]],['paperless',96,[[55,56.5,'err']]],['pihole',12,[]]];
document.getElementById('lanes').innerHTML=L.map(([n,ms,segs])=>`<div class="lane"><span>${n}</span><div class="bar">${segs.map(s=>`<div class="seg" style="left:${s[0]}%;width:${Math.max(s[1]-s[0],.8)}%;background:${col[s[2]]}"></div>`).join('')}<div class="now"></div></div><span class="ms">${ms?ms+' ms':'—'}</span></div>`).join('');

// command palette
const C=[['jellyfin\'i yeniden başlat','servis'],['gitea loglarını aç','log'],['vaultwarden sertifikasını yenile','ssl'],['servisler','sayfa'],['konteynerler','sayfa'],['metrikler','sayfa'],['yeni servis ekle','eylem'],['sistemi temizle (prune)','eylem'],['ayarlar','sayfa']];
const cmd=document.getElementById('cmd'),q=document.getElementById('q'),res=document.getElementById('res');let sel=0,list=C;
function draw(){res.innerHTML=list.slice(0,7).map((c,i)=>`<li class="${i===sel?'on':''}">${c[0]}<span>${c[1]}</span></li>`).join('')}
q.oninput=()=>{const v=q.value.toLowerCase();list=C.filter(c=>c[0].toLowerCase().includes(v));sel=0;draw()};
addEventListener('keydown',e=>{
  if(cmd.classList.contains('open')){
    if(e.key==='Escape')cmd.classList.remove('open');
    if(e.key==='ArrowDown'){sel=Math.min(sel+1,list.length-1);draw();e.preventDefault()}
    if(e.key==='ArrowUp'){sel=Math.max(sel-1,0);draw();e.preventDefault()}
    if(e.key==='Enter'&&list[sel]){cmd.classList.remove('open');toast('→ '+list[sel][0])}
    return}
  if(e.key==='/'||(e.key==='k'&&(e.metaKey||e.ctrlKey))){e.preventDefault();cmd.classList.add('open');q.value='';list=C;sel=0;draw();setTimeout(()=>q.focus(),10)}
  if(hovered){const x=issues.find(i=>i.id===hovered);if(!x)return;const a=x.a.find(a=>a[1].toLowerCase()===e.key.toLowerCase());if(a)resolve(x.id,a[0])}
});
cmd.onclick=e=>{if(e.target===cmd)cmd.classList.remove('open')};
setInterval(()=>document.getElementById('clock').textContent=new Date().toTimeString().slice(0,5),1000);
</script>
</body>
</html>
