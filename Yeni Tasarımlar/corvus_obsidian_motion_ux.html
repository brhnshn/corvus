<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Corvus — ObsidianUI Motion Design & UI/UX Prototipi</title>
  <style>
    /*
     * CORVUS × OBSIDIANUI — UI/UX & MOTION DESIGN SYSTEM
     * - Sıfır gradyan (No gradients), Sıfır parlama (No glow)
     * - Grimsi Bulut Beyazı (#dfe3e8 / #c8cdd4) + Mat Obsidyen (#0a0a0c / #131316)
     * - Fizik tabanlı yay (Spring) geçişleri, kayan aktif/hover hapları (Gliding Pills),
     *   kademeli (staggered) sahne koreografisi, interaktif grafik crosshair ve Slow-Mo test modu.
     */
    :root {
      --bg-canvas: #0a0a0c;
      --bg-shell: #0e0e11;
      --bg-card: #131316;
      --bg-subtle: #18191d;
      --bg-hover: #1e2025;
      --bg-active: #25272d;

      --border-hairline: #222328;
      --border-strong: #32343c;

      /* Grimsi Bulut Beyazı (Greyish Cloud White) */
      --cloud-100: #f0f2f4;
      --cloud-200: #dfe3e8;
      --cloud-300: #c8cdd4;
      --cloud-400: #969ca6;
      --cloud-500: #666b74;

      --text-primary: #eceef0;
      --text-secondary: #989ea6;
      --text-muted: #646970;

      /* Mat durum renkleri (Parlamasız) */
      --status-up: #34d399;
      --status-up-bg: rgba(52, 211, 153, 0.08);
      --status-warn: #e5a93c;
      --status-warn-bg: rgba(229, 169, 60, 0.08);
      --status-down: #e5534b;
      --status-down-bg: rgba(229, 83, 75, 0.08);

      --sidebar-w: 232px;
      --radius-sm: 5px;
      --radius-md: 8px;
      --radius-lg: 10px;

      /* Motion Design Tokens (Dinamik hız çarpanı ile Slow-Mo desteği) */
      --motion-scale: 1;
      --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-out-quart: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);

      --dur-fast: calc(140ms * var(--motion-scale));
      --dur-base: calc(260ms * var(--motion-scale));
      --dur-slow: calc(420ms * var(--motion-scale));
      --dur-chart: calc(750ms * var(--motion-scale));

      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    html[data-mode="light"] {
      --bg-canvas: #f4f5f7;
      --bg-shell: #ebedf0;
      --bg-card: #ffffff;
      --bg-subtle: #f7f8f9;
      --bg-hover: #e9ebef;
      --bg-active: #dde0e6;

      --border-hairline: #dcdfe4;
      --border-strong: #c2c6ce;

      --cloud-100: #141518;
      --cloud-200: #24262b;
      --cloud-300: #3d4047;
      --cloud-400: #5c616a;
      --cloud-500: #848a94;

      --text-primary: #141518;
      --text-secondary: #52575e;
      --text-muted: #7b818a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      transition: background-color var(--dur-base) var(--ease-out-quart), color var(--dur-base) var(--ease-out-quart);
    }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

    .shell {
      display: flex;
      height: 100dvh;
      width: 100vw;
      background: var(--bg-canvas);
    }

    /* --- 1. SIDEBAR WITH GLIDING HOVER & SLIDING ACTIVE PILL (ObsidianUI Signature) --- */
    .sidebar {
      width: var(--sidebar-w);
      min-width: 184px;
      max-width: 320px;
      background: var(--bg-shell);
      border-right: 1px solid var(--border-hairline);
      display: flex;
      flex-direction: column;
      position: relative;
      flex-shrink: 0;
      user-select: none;
      transition: background-color var(--dur-base) var(--ease-out-quart);
    }

    .sidebar-resizer {
      position: absolute;
      top: 0;
      right: -2px;
      width: 5px;
      height: 100%;
      cursor: col-resize;
      z-index: 25;
      transition: background-color var(--dur-fast) var(--ease-out-quart);
    }
    .sidebar-resizer:hover, .sidebar-resizer.active {
      background: var(--cloud-300);
    }

    .sidebar-top {
      padding: 14px 14px 12px;
      border-bottom: 1px solid var(--border-hairline);
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 600;
      font-size: 13.5px;
      letter-spacing: 0.04em;
    }

    .brand-mark {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      background: var(--cloud-200);
      color: var(--bg-canvas);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
      transition: transform var(--dur-fast) var(--ease-spring);
    }
    .brand:hover .brand-mark {
      transform: scale(1.06) rotate(-3deg);
    }

    .system-selector, .cmd-trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 9px;
      background: var(--bg-card);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 12px;
      cursor: pointer;
      transition: border-color var(--dur-fast) var(--ease-out-quart), transform var(--dur-fast) var(--ease-spring), background-color var(--dur-fast);
    }
    .cmd-trigger {
      background: var(--bg-subtle);
      color: var(--text-secondary);
    }
    .system-selector:hover, .cmd-trigger:hover {
      border-color: var(--border-strong);
      color: var(--text-primary);
    }
    .system-selector:active, .cmd-trigger:active {
      transform: scale(0.98);
    }

    .kbd {
      font-family: var(--font-mono);
      font-size: 10.5px;
      padding: 1px 5px;
      border-radius: 3px;
      background: var(--bg-card);
      border: 1px solid var(--border-hairline);
      color: var(--text-muted);
    }

    /* Gliding Nav Container */
    .nav-list {
      flex: 1;
      padding: 10px 8px;
      overflow-y: auto;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-section-title {
      font-size: 10.5px;
      font-weight: 500;
      color: var(--text-muted);
      padding: 4px 8px 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Gliding Hover Pill & Sliding Active Pill */
    .nav-hover-pill {
      position: absolute;
      left: 8px;
      right: 8px;
      height: 33px;
      background: var(--bg-hover);
      border-radius: var(--radius-sm);
      pointer-events: none;
      opacity: 0;
      z-index: 0;
      transition: transform var(--dur-base) var(--ease-spring), height var(--dur-base) var(--ease-spring), opacity var(--dur-fast) ease;
    }

    .nav-active-pill {
      position: absolute;
      left: 8px;
      right: 8px;
      height: 33px;
      background: var(--cloud-200);
      border-radius: var(--radius-sm);
      pointer-events: none;
      z-index: 1;
      transition: transform var(--dur-base) var(--ease-spring), height var(--dur-base) var(--ease-spring), opacity var(--dur-fast) ease;
    }

    .nav-btn {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 33px;
      padding: 0 10px;
      border-radius: var(--radius-sm);
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: color var(--dur-fast) var(--ease-out-quart), transform var(--dur-fast) var(--ease-spring);
    }
    .nav-btn:hover {
      color: var(--text-primary);
    }
    .nav-btn:active {
      transform: scale(0.985);
    }
    .nav-btn.active {
      color: var(--bg-canvas);
      font-weight: 600;
    }

    .nav-btn-left {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .nav-btn svg {
      width: 15px;
      height: 15px;
      stroke-width: 1.8;
      flex-shrink: 0;
      transition: transform var(--dur-base) var(--ease-spring);
    }
    .nav-btn:hover svg {
      transform: translateX(1.5px);
    }

    .nav-meta {
      font-family: var(--font-mono);
      font-size: 11px;
      opacity: 0.75;
    }

    .sidebar-footer {
      padding: 10px 12px;
      border-top: 1px solid var(--border-hairline);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .footer-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 12px;
      cursor: pointer;
      transition: background-color var(--dur-fast), color var(--dur-fast);
    }
    .footer-link:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .version-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 8px;
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    /* --- 2. MAIN WORKSPACE & STICKY HEADER --- */
    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100dvh;
    }

    .header {
      height: 50px;
      padding: 0 22px;
      border-bottom: 1px solid var(--border-hairline);
      background: var(--bg-shell);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 12px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .page-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .header-context {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }
    .dot-up { background: var(--status-up); }
    .dot-warn { background: var(--status-warn); }
    .dot-down { background: var(--status-down); }
    .dot-muted { background: var(--text-muted); }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Tactile Buttons with Micro-Press Physics */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-hairline);
      cursor: pointer;
      transition: background-color var(--dur-fast) var(--ease-out-quart),
                  border-color var(--dur-fast) var(--ease-out-quart),
                  transform var(--dur-fast) var(--ease-spring);
    }
    .btn:hover {
      background: var(--bg-hover);
      border-color: var(--border-strong);
    }
    .btn:active {
      transform: scale(0.96);
    }
    .btn-cloud {
      background: var(--cloud-200);
      color: var(--bg-canvas);
      border-color: var(--cloud-200);
      font-weight: 600;
    }
    .btn-cloud:hover {
      background: var(--cloud-100);
      border-color: var(--cloud-100);
    }
    .btn-ghost {
      background: transparent;
      border-color: transparent;
      color: var(--text-secondary);
    }
    .btn-ghost:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }
    .btn-sm {
      padding: 3px 8px;
      font-size: 11.5px;
    }

    /* --- 3. STAGGERED PAGE CHOREOGRAPHY & MICRO-MOTION --- */
    .page-body {
      flex: 1;
      overflow-y: auto;
      padding: 22px;
    }

    .page-inner {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 70px;
    }

    @keyframes stageEnter {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .motion-item {
      opacity: 0;
      animation: stageEnter var(--dur-slow) var(--ease-spring) forwards;
      animation-delay: calc(var(--stagger, 0) * 42ms * var(--motion-scale));
    }

    /* Cards with subtle border & elevation choreography */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      transition: border-color var(--dur-fast) var(--ease-out-quart),
                  background-color var(--dur-base) var(--ease-out-quart);
    }

    .card-head {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .card-head-title {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .card-content {
      padding: 16px;
    }

    .quiet-banner {
      padding: 14px 18px;
      background: var(--bg-card);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .quiet-summary {
      font-size: 13.5px;
      color: var(--text-secondary);
    }
    .quiet-summary strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    /* KPI 4'lü Şerit + Tabular Odometer Numbers */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .kpi-box {
      background: var(--bg-card);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color var(--dur-fast) var(--ease-out-quart),
                  transform var(--dur-base) var(--ease-spring);
    }
    .kpi-box:hover {
      border-color: var(--border-strong);
      transform: translateY(-2px);
    }

    .kpi-label {
      font-size: 11.5px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .kpi-val {
      font-size: 22px;
      font-weight: 600;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }

    .kpi-sub {
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .alert-strip {
      padding: 10px 14px;
      background: var(--status-warn-bg);
      border: 1px solid rgba(229, 169, 60, 0.22);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12.5px;
    }

    /* Animated Bar Fill */
    .bar-track {
      width: 100%;
      height: 4px;
      background: var(--bg-active);
      border-radius: 2px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: var(--cloud-200);
      border-radius: 2px;
      width: 0;
      transition: width var(--dur-chart) var(--ease-spring);
    }

    /* Tables with Expandable Drawer Rows */
    .table-wrap { width: 100%; overflow-x: auto; }
    .table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .table th {
      text-align: left;
      padding: 9px 14px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-hairline);
      background: var(--bg-subtle);
    }
    .table td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-hairline);
      color: var(--text-primary);
      vertical-align: middle;
      transition: background-color var(--dur-fast);
    }
    .table tr.data-row {
      cursor: pointer;
    }
    .table tr.data-row:hover td {
      background: var(--bg-subtle);
    }
    .table tr.data-row.selected td {
      background: var(--bg-hover);
    }

    /* Expandable Accordion Row Detail */
    .expand-cell {
      padding: 0 !important;
      border-bottom: 1px solid var(--border-hairline);
      background: var(--bg-canvas);
    }
    .expand-wrapper {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows var(--dur-base) var(--ease-spring);
    }
    .expand-wrapper.open {
      grid-template-rows: 1fr;
    }
    .expand-inner {
      overflow: hidden;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-family: var(--font-mono);
      font-weight: 500;
      border: 1px solid var(--border-hairline);
      background: var(--bg-subtle);
      color: var(--text-secondary);
      transition: transform var(--dur-fast) var(--ease-spring);
    }
    .badge-up { color: var(--status-up); background: var(--status-up-bg); border-color: rgba(52, 211, 153, 0.2); }
    .badge-warn { color: var(--status-warn); background: var(--status-warn-bg); border-color: rgba(229, 169, 60, 0.2); }
    .badge-down { color: var(--status-down); background: var(--status-down-bg); border-color: rgba(229, 83, 75, 0.2); }

    /* Sliding Pill Tabs (Segmented Control with Animated Background Pill) */
    .tabs {
      display: inline-flex;
      position: relative;
      background: var(--bg-subtle);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-sm);
      padding: 2px;
      gap: 2px;
    }
    .tab {
      position: relative;
      z-index: 2;
      padding: 4px 11px;
      border-radius: 3px;
      font-size: 12px;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: color var(--dur-fast) var(--ease-out-quart), background-color var(--dur-fast) var(--ease-spring);
    }
    .tab:hover { color: var(--text-primary); }
    .tab.active {
      background: var(--cloud-200);
      color: var(--bg-canvas);
      font-weight: 600;
    }

    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .input {
      background: var(--bg-card);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      color: var(--text-primary);
      font-size: 12.5px;
      outline: none;
      min-width: 210px;
      transition: border-color var(--dur-fast);
    }
    .input:focus { border-color: var(--cloud-300); }

    /* Service Cards with Tactile Hover Lift */
    .service-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }
    .service-card {
      background: var(--bg-card);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color var(--dur-fast) var(--ease-out-quart),
                  transform var(--dur-base) var(--ease-spring);
    }
    .service-card:hover {
      border-color: var(--border-strong);
      transform: translateY(-2px);
    }

    /* Uptime Bars with Wave Hover Scale */
    .uptime-strip {
      display: flex;
      gap: 2px;
      height: 20px;
      align-items: center;
    }
    .uptime-seg {
      flex: 1;
      height: 100%;
      border-radius: 1.5px;
      background: var(--cloud-300);
      opacity: 0.72;
      cursor: pointer;
      transition: transform var(--dur-fast) var(--ease-spring), opacity var(--dur-fast);
    }
    .uptime-seg:hover {
      opacity: 1;
      transform: scaleY(1.28);
    }
    .uptime-seg.warn { background: var(--status-warn); opacity: 0.9; }
    .uptime-seg.down { background: var(--status-down); opacity: 0.9; }

    /* SVG Line Chart Stroke Draw Animation */
    @keyframes drawStroke {
      from { stroke-dashoffset: 900; }
      to { stroke-dashoffset: 0; }
    }
    .chart-line-anim {
      stroke-dasharray: 900;
      stroke-dashoffset: 900;
      animation: drawStroke var(--dur-chart) var(--ease-out-quart) forwards;
    }

    /* ObsidianUI Spring + Blur Modal & Slide-Over Sheet */
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.58);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 60;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--dur-base) var(--ease-out-quart);
    }
    .backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .modal {
      width: 100%;
      max-width: 640px;
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transform: scale(0.95) translateY(8px);
      filter: blur(3px);
      transition: transform var(--dur-base) var(--ease-spring),
                  filter var(--dur-base) var(--ease-out-quart);
    }
    .backdrop.open .modal {
      transform: scale(1) translateY(0);
      filter: blur(0px);
    }

    /* ObsidianUI Floating Bulk Action Bar (Spring Slide-Up) */
    .bulk-bar {
      position: fixed;
      bottom: 20px;
      left: calc(50% + (var(--sidebar-w) / 2));
      transform: translateX(-50%) translateY(80px) scale(0.95);
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 7px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 45;
      opacity: 0;
      pointer-events: none;
      transition: transform var(--dur-base) var(--ease-spring),
                  opacity var(--dur-fast) var(--ease-out-quart);
    }
    .bulk-bar.visible {
      transform: translateX(-50%) translateY(0) scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    /* Sonner-Style Stacked Toast with Progress & Undo */
    .toast-wrap {
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 90;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    @keyframes toastEnter {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .toast {
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      color: var(--text-primary);
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-width: 260px;
      position: relative;
      overflow: hidden;
      animation: toastEnter var(--dur-base) var(--ease-spring) forwards;
    }
    .toast-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 2px;
      background: var(--cloud-200);
      width: 100%;
      transition: width 2.8s linear;
    }

    .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    /* Spinner for inline button state morph */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 11px;
      height: 11px;
      border: 1.5px solid var(--text-muted);
      border-top-color: var(--cloud-100);
      border-radius: 50%;
      display: inline-block;
      animation: spin 0.55s linear infinite;
    }

    @media (max-width: 920px) {
      .kpi-row { grid-template-columns: repeat(2, 1fr); }
      .grid-2 { grid-template-columns: 1fr; }
    }
  </style>

      document.documentElement.style.setProperty('--motion-scale', scale);
      ['spd1', 'spdSlow', 'spdOff'].forEach(id => {
        document.getElementById(id).classList.toggle('active', id === btnId);
      });
      toast(scale > 1 ? '0.35x Yavaş Çekim (Slow-Mo) modu aktif: Geçişleri detaylı inceleyebilirsiniz' : scale < 0.1 ? 'Reduced Motion (Anında geçiş) aktif' : '1x Standart Obsidian yay fiziği aktif');
    }

    // --- 3. SMOOTH NUMBER COUNTER (Odometer Animation) ---
    function animateCounters() {
      document.querySelectorAll('[data-count]').forEach(el => {
        const target = parseFloat(el.getAttribute('data-count'));
        const suffix = el.getAttribute('data-suffix') || '';
        const prefix = el.getAttribute('data-prefix') || '';
        const decimals = parseInt(el.getAttribute('data-decimals') || '0', 10);
        const duration = 420 * parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--motion-scale') || 1);
        const start = performance.now();

        function tick(now) {
          const p = Math.min(1, (now - start) / duration);
          const eased = 1 - Math.pow(1 - p, 3);
          const val = (target * eased).toFixed(decimals);
          el.textContent = `${prefix}${val}${suffix}`;
          if (p < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      });

      // Animate progress bars smoothly after mount
      requestAnimationFrame(() => {
        document.querySelectorAll('[data-width]').forEach(bar => {
          bar.style.width = bar.getAttribute('data-width');
        });
      });
    }

    // --- SIDEBAR RESIZER ---
    const resizer = document.getElementById('resizer');
    let dragging = false;
    resizer.addEventListener('mousedown', () => { dragging = true; resizer.classList.add('active'); });
    resizer.addEventListener('dblclick', () => {
      document.documentElement.style.setProperty('--sidebar-w', '232px');
      toast('Kenar çubuğu genişliği sıfırlandı (232px)');

    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      const w = Math.max(184, Math.min(320, e.clientX));
      document.documentElement.style.setProperty('--sidebar-w', w + 'px');

    window.addEventListener('mouseup', () => { dragging = false; resizer.classList.remove('active'); });

    }

    function toggleSelectAllContainers(checked) {
      if (checked) containers.forEach(c => selectedContainerIds.add(c.id));
      else selectedContainerIds.clear();
      updateBulkBar();
      render();
    }

    function clearBulkSelection() {
      selectedContainerIds.clear();
      updateBulkBar();
      render();
    }

    function updateBulkBar() {
      const bar = document.getElementById('bulkBar');
      document.getElementById('bulkCount').textContent = selectedContainerIds.size;
      bar.classList.toggle('visible', selectedContainerIds.size > 0);
    }

    function runBulkAction(actionText) {
      const count = selectedContainerIds.size;
      clearBulkSelection();
      toast(`${count} konteyner için işlem uygulandı: ${actionText}`, true);
    }

    function morphContainerAction(id, btnEl) {
      const c = containers.find(x => x.id === id);
      if (!c) return;
      const prevStatus = c.status;
      btnEl.innerHTML = `<span class="spinner"></span>`;
      btnEl.disabled = true;

      setTimeout(() => {
        c.status = prevStatus === 'running' ? 'stopped' : 'running';
        c.cpu = c.status === 'running' ? 3.4 : 0.0;
        render();
        toast(`${c.name} ${c.status === 'running' ? 'başlatıldı' : 'durduruldu'}`, true, () => {
          c.status = prevStatus;
          render();
          toast(`${c.name} durumu geri alındı`);
        });
      }, 320);
    }

    function pingSingleService(id, btnEl) {
      const s = services.find(x => x.id === id);
      if (!s) return;
      btnEl.innerHTML = `<span class="spinner"></span>`;
      setTimeout(() => {
        s.status = 'up';
        s.latency = Math.floor(Math.random() * 14) + 4;
        s.lastCheck = 'Şimdi';
        render();
        toast(`${s.name} yanıt verdi: ${s.latency} ms (HTTP 200)`);
      }, 280);
    }

    function checkAllServices() {
      services.forEach(s => { s.lastCheck = 'Şimdi'; });
      render();
      toast('Tüm servisler eşzamanlı kontrol edildi');
    }

    // SVG Chart Crosshair Scrubbing
    function scrubChart(e, svgEl, labelId, metricName) {
      const rect = svgEl.getBoundingClientRect();
      const relX = Math.max(0, Math.min(540, ((e.clientX - rect.left) / rect.width) * 540));
      const line = svgEl.querySelector('.scrub-line');
      if (line) {
        line.setAttribute('x1', relX);
        line.setAttribute('x2', relX);
      }
      const minsAgo = Math.round(30 - (relX / 540) * 30);
      const val = metricName === 'CPU' ? (18 + Math.round(Math.sin(relX / 35) * 12 + 8)) : (36 + Math.round(Math.cos(relX / 50) * 2));
      document.getElementById(labelId).textContent = `${minsAgo} dk önce → ${metricName}: %${val}`;
    }

    function resetChartScrub(labelId, defaultText) {
      document.getElementById(labelId).textContent = defaultText;
      document.querySelectorAll('.scrub-line').forEach(l => {
        l.setAttribute('x1', -10);
        l.setAttribute('x2', -10);
      });
    }

    function selectSystem(id, ip) {
      document.getElementById('activeSystemName').textContent = id;
      document.getElementById('headerSub').textContent = `${id} (${ip})`;
      go('dashboard');
      toast(`${id} sunucusuna geçiş yapıldı`);
    }

    function openInspect(name, tab) {
      inspectedContainer = name;
      inspectTab = tab;
      document.getElementById('inspectTitle').textContent = name;
      openModal('inspectModal');
      renderInspectContent();
    }

    function switchInspectTab(tab) {
      inspectTab = tab;
      renderInspectContent();
    }

    function renderInspectContent() {
      document.getElementById('tabLogsBtn').classList.toggle('active', inspectTab === 'logs');
      document.getElementById('tabTermBtn').classList.toggle('active', inspectTab === 'term');
      document.getElementById('tabYamlBtn').classList.toggle('active', inspectTab === 'yaml');

      const body = document.getElementById('inspectBody');
      if (inspectTab === 'logs') {
        body.innerHTML = `
          <div style="color:var(--text-muted);">[2026-10-13 20:52:01] INF Starting container ${inspectedContainer}...</div>
          <div style="color:var(--text-secondary);">[2026-10-13 20:52:04] INF Listening on internal socket</div>
          <div style="color:var(--text-secondary);">[2026-10-13 20:54:12] INF Healthcheck HTTP 200 OK (11ms)</div>
          <div style="color:var(--cloud-200);">[2026-10-13 20:58:00] INF Worker queue processed 42 items</div>
        `;
      } else if (inspectTab === 'term') {
        body.innerHTML = `
          <div style="color:var(--text-muted);">Connected to /bin/sh inside ${inspectedContainer}</div>
          <div style="margin-top:8px;">root@${inspectedContainer}:/# <span style="color:var(--cloud-200);">ps aux</span></div>
          <div style="color:var(--text-secondary);">PID   USER     TIME  COMMAND</div>
          <div style="color:var(--text-secondary);">  1   root     0:14  /app/server --port 8080</div>
          <div style="margin-top:10px;display:flex;gap:8px;align-items:center;">
            <span>root@${inspectedContainer}:/#</span>
            <input class="input mono" style="flex:1;padding:3px 6px;" placeholder="Komut girip Enter'a basın..." onkeydown="if(event.key==='Enter'){this.parentElement.insertAdjacentHTML('beforebegin','<div style=color:var(--cloud-200)>root@${inspectedContainer}:/# '+this.value+'</div>');this.value='';}" />
          </div>
        `;
      } else {
        body.innerHTML = `<pre style="color:var(--cloud-200);">services:
  ${inspectedContainer}:
    image: ghcr.io/${inspectedContainer}:latest
    restart: unless-stopped
    network_mode: bridge</pre>`;
      }
    }

    function saveNewService() {
      const name = document.getElementById('srvNameInput').value.trim() || 'Yeni Servis';
      const category = document.getElementById('srvCatInput').value.trim() || 'Altyapı';
      const type = document.getElementById('srvTypeInput').value;
      const url = document.getElementById('srvUrlInput').value.trim() || 'http://10.0.0.12';
      services.push({
        id: 's' + (services.length + 1),
        name,
        category,
        url,
        type,
        status: 'up',
        latency: 9,
        uptime: 100.0,
        lastCheck: 'Şimdi'
      });
      closeModal('addServiceModal');
      render();
      toast(`${name} servisi eklendi`);
    }

    function toggleLightMode() {
      const html = document.documentElement;
      const isLight = html.getAttribute('data-mode') === 'light';
      html.setAttribute('data-mode', isLight ? 'dark' : 'light');
      toast(isLight ? 'Koyu Obsidian teması aktif' : 'Açık Bulut teması aktif');
    }

    function openModal(id) { document.getElementById(id).classList.add('open'); }
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }

    // --- KOMUT PALETİ ---
    const cmdList = [
      { label: 'Kontrol Paneli (Dashboard)', act: () => go('dashboard') },
      { label: 'Servisler', act: () => go('services') },
      { label: 'Konteynerler (Satır İçi Çekmece & Toplu Seçim)', act: () => go('containers') },
      { label: 'Sistem Metrikleri (Etkileşimli Crosshair Grafikler)', act: () => go('metrics') },
      { label: 'Uptime & Snitch İzleyicileri', act: () => go('uptime') },
      { label: 'Olay Geçmişi', act: () => go('activity') },
      { label: 'UI/UX & Motion Design Rehberi', act: () => go('motion-lab') },
      { label: '0.35x Yavaş Çekim (Slow-Mo) Modunu Aç', act: () => setMotionScale(2.8, 'spdSlow') }
    ];

    function openCmdModal() {
      openModal('cmdModal');
      const inp = document.getElementById('cmdSearchInput');
      inp.value = '';
      renderCmdItems('');
      setTimeout(() => inp.focus(), 50);
    }

    function renderCmdItems(q) {
      const box = document.getElementById('cmdResults');
      const filtered = cmdList.filter(x => x.label.toLowerCase().includes(q.toLowerCase()));
      box.innerHTML = filtered.map(item => `
        <div style="padding:8px 10px;border-radius:5px;cursor:pointer;display:flex;justify-content:space-between;color:var(--text-primary);transition:background var(--dur-fast);"
             onmouseover="this.style.background='var(--bg-hover)'"
             onmouseout="this.style.background='transparent'"
             onclick="closeModal('cmdModal');cmdList[${cmdList.indexOf(item)}].act()">
          <span>${item.label}</span>
          <span class="kbd">↵</span>
        </div>
      `).join('');
    }

    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        openCmdModal();
      } else if (e.key === 'Escape') {
        ['cmdModal', 'inspectModal', 'addServiceModal'].forEach(closeModal);
      }
    });

    // Sonner-style Toast with animated progress bar & optional Undo
    function toast(msg, showUndo = false, undoCallback = null) {
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast';
      el.innerHTML = `
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="dot dot-up"></span>
          <span>${msg}</span>
        </div>
        ${showUndo ? `<button class="btn btn-sm" id="undoBtn" style="padding:2px 7px;font-size:11px;">Geri Al</button>` : ''}
        <div class="toast-progress"></div>
      `;
      wrap.appendChild(el);
      if (showUndo && undoCallback) {
        el.querySelector('#undoBtn').onclick = () => {
          undoCallback();
          el.remove();
        };
      }
      requestAnimationFrame(() => {
        const prog = el.querySelector('.toast-progress');
        if (prog) prog.style.width = '0%';
      });
      setTimeout(() => el.remove(), 2900);
    }

    // Initialize
    render();
  </script>
</body>
</html>
